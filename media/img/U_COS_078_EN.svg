<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><rect width="1000" height="450" fill="white"/><text x="500" y="37" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#172334">Two evaluation paths in binary64</text><rect x="355.0" y="65.5" width="290" height="55" rx="8" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="500" y="101" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172334">x = 2⁻⁵⁴</text><path d="M500 121 L250 165" stroke="#334155" stroke-width="3" fill="none"/><path d="M500 121 L750 165" stroke="#334155" stroke-width="3" fill="none"/><rect x="40.0" y="165.0" width="420" height="60" rx="8" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="250" y="203" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172334">√(1 + x) − 1</text><rect x="540.0" y="165.0" width="420" height="60" rx="8" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="750" y="203" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172334">x / (√(1 + x) + 1)</text><path d="M250 225 L250 265" stroke="#334155" stroke-width="3" fill="none"/><path d="M750 225 L750 265" stroke="#334155" stroke-width="3" fill="none"/><rect x="40.0" y="265.0" width="420" height="60" rx="8" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="250" y="303" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172334">1 + x → 1</text><rect x="540.0" y="265.0" width="420" height="60" rx="8" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="750" y="303" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172334">√(1 + x) + 1 → 2</text><path d="M250 325 L250 365" stroke="#334155" stroke-width="3" fill="none"/><path d="M750 325 L750 365" stroke="#334155" stroke-width="3" fill="none"/><text x="250" y="400" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#172334">0</text><text x="750" y="400" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#172334">≈ 2⁻⁵⁵</text></svg>