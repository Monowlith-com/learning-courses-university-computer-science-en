<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Closed-loop control of a robot</title><desc>Block diagram of a closed control loop: sensors measure the environment; the controller sends commands to actuators, which affect the environment; new measurements are fed back.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Closed-loop control of a robot</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Sensors → Controller → Actuators → Environment</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><rect x="57" y="160" width="173" height="105" fill="#dcecff" stroke="#286fba" rx="13" stroke-width="2" /><text x="143.5" y="202" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Sensors</text><text x="143.5" y="231" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Measurements</text><rect x="279" y="160" width="173" height="105" fill="#ffe7cf" stroke="#bc6924" rx="13" stroke-width="2" /><text x="365.5" y="202" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Controller</text><text x="365.5" y="231" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Decision</text><rect x="501" y="160" width="173" height="105" fill="#dcecff" stroke="#286fba" rx="13" stroke-width="2" /><text x="587.5" y="202" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Actuators</text><text x="587.5" y="231" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Movement</text><rect x="723" y="160" width="126" height="105" fill="#ffe7cf" stroke="#bc6924" rx="13" stroke-width="2" /><text x="786.0" y="202" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Environment</text><text x="786.0" y="231" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Effect</text><line x1="237.00" y1="212.00" x2="270.00" y2="212.00" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><polygon points="270.00,212.00 259.00,206.00 259.00,218.00" fill="#253d59" stroke="#253d59" stroke-width="2" /><line x1="459.00" y1="212.00" x2="492.00" y2="212.00" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><polygon points="492.00,212.00 481.00,206.00 481.00,218.00" fill="#253d59" stroke="#253d59" stroke-width="2" /><line x1="681.00" y1="212.00" x2="714.00" y2="212.00" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><polygon points="714.00,212.00 703.00,206.00 703.00,218.00" fill="#253d59" stroke="#253d59" stroke-width="2" /><polyline points="786.00,265.00 786.00,395.00 145.00,395.00 145.00,268.00" fill="none" stroke="#bc6924" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="145.00,268.00 139.00,280.00 151.00,280.00" fill="#bc6924" stroke="#bc6924" stroke-width="2" /><text x="450" y="435" fill="#bc6924" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Feedback: new measurement after the action</text><text x="450" y="491" fill="#61758a" font-size="16" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">A model can plan; safe execution requires real sensor checks.</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Simplified architecture; additional safety shutdowns are required.</text></svg>