<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="An accessible form with a labelled input, visible keyboard focus and a readable Save button. This sketch is not a complete accessibility test.">
<title>Usable without a mouse</title>
<desc>An accessible form with a labelled input, visible keyboard focus and a readable Save button. This sketch is not a complete accessibility test.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2976BD"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8793A6"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect x="16" y="16" width="928" height="568" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
