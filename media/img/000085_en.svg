<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-label="Post-quantum migration: inventory, prioritisation, migration and verification">
<rect width="900" height="675" fill="#ffffff"/>
<style>.t{font:600 28px system-ui,Arial,sans-serif;fill:#243246}.sub{font:18px system-ui,Arial,sans-serif;fill:#45556c}.note{font:17px system-ui,Arial,sans-serif;fill:#475569}.label{font:600 19px system-ui,Arial,sans-serif;fill:#203754}</style>
<text x="48" y="64" class="t" >Post-quantum security: migration in stages</text>
<text x="48" y="99" class="sub" >From system inventory to controlled migration</text>
<rect x="56" y="220" width="160" height="190" rx="14" fill="#eef5ff" stroke="#7ba9e2" stroke-width="2"/>
<text x="72" y="262" class="label" >1. Inventory</text>
<text x="72" y="313" class="note" >Services, keys,</text>
<text x="72" y="342" class="note" >certificates</text>
<rect x="265" y="220" width="160" height="190" rx="14" fill="#eef5ff" stroke="#7ba9e2" stroke-width="2"/>
<text x="281" y="262" class="label" >2. Prioritise</text>
<text x="281" y="313" class="note" >Protection period,</text>
<text x="281" y="342" class="note" >risks</text>
<rect x="474" y="220" width="160" height="190" rx="14" fill="#eef5ff" stroke="#7ba9e2" stroke-width="2"/>
<text x="490" y="262" class="label" >3. Migrate</text>
<text x="490" y="313" class="note" >Vetted protocols,</text>
<text x="490" y="342" class="note" >libraries</text>
<rect x="683" y="220" width="160" height="190" rx="14" fill="#eef5ff" stroke="#7ba9e2" stroke-width="2"/>
<text x="699" y="262" class="label" >4. Verify</text>
<text x="699" y="313" class="note" >Compatibility,</text>
<text x="699" y="342" class="note" >monitoring</text>
<path d="M223,315 L258,315 M247.2,320.2 L258,315 L247.2,309.8" fill="none" stroke="#3e80dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M432,315 L467,315 M456.2,320.2 L467,315 L456.2,309.8" fill="none" stroke="#3e80dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M640,315 L675,315 M664.2,320.2 L675,315 L664.2,309.8" fill="none" stroke="#3e80dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="503" class="note" >KEM (key establishment): FIPS 203 / ML-KEM</text>
<text x="78" y="540" class="note" >Signatures (authenticity): FIPS 204/205 / ML-DSA, SLH-DSA</text>
<text x="78" y="589" class="note" >Roles, devices, keys and failure paths must work together.</text>
</svg>