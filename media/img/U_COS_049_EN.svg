<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Five evaluation dimensions: quality, robustness, safety, costs and documentation. Each is assessed using specific criteria and evidence; no single metric replaces the overall assessment.">
<title>Evaluating AI systems across dimensions</title>
<desc>Five evaluation dimensions: quality, robustness, safety, costs and documentation. Each is assessed using specific criteria and evidence; no single metric replaces the overall assessment.</desc>
