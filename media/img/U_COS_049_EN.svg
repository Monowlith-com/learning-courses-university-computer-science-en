<rect x="408" y="156" width="166" height="323" rx="5" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="408" y="156" width="166" height="67" rx="5" fill="#EAF4FF" stroke="#CBD5E1" stroke-width="1.5"/>
