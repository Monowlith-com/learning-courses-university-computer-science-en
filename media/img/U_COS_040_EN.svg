<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="An image encoder processes image inputs and a text tokenizer processes the question. Multimodal coupling combines features for the language model, which generates an answer.">
