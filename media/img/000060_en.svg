<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Input text is split into tokens, which are processed within a limited context window. The language model calculates distributions for the next token. Selected tokens are fed into the next step.">
<title>From characters to output tokens</title>
<desc>Input text is split into tokens, which are processed within a limited context window. The language model calculates distributions for the next token. Selected tokens are fed into the next step.</desc>
