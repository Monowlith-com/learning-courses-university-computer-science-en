<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Graph: vertices and edges</title><desc>Four vertices A, B, C and D, connected by the undirected edges AB, BC, BD and CD. A path from A to D can pass through B.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Graph: vertices and edges</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">An undirected network with four vertices</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="200.00" y1="320.00" x2="400.00" y2="235.00" stroke="#286fba" stroke-width="5" stroke-linecap="round" /><line x1="400.00" y1="235.00" x2="630.00" y2="260.00" stroke="#286fba" stroke-width="5" stroke-linecap="round" /><line x1="400.00" y1="235.00" x2="585.00" y2="438.00" stroke="#286fba" stroke-width="5" stroke-linecap="round" /><line x1="630.00" y1="260.00" x2="585.00" y2="438.00" stroke="#286fba" stroke-width="5" stroke-linecap="round" /><circle cx="200.00" cy="320.00" r="34" fill="#dcecff" stroke="#286fba" stroke-width="3" /><text x="200" y="330" fill="#253d59" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">A</text><circle cx="400.00" cy="235.00" r="34" fill="#dcecff" stroke="#286fba" stroke-width="3" /><text x="400" y="245" fill="#253d59" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">B</text><circle cx="630.00" cy="260.00" r="34" fill="#dcecff" stroke="#286fba" stroke-width="3" /><text x="630" y="270" fill="#253d59" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">C</text><circle cx="585.00" cy="438.00" r="34" fill="#ffe7cf" stroke="#bc6924" stroke-width="3" /><text x="585" y="448" fill="#253d59" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">D</text><text x="450" y="535" fill="#253d59" font-size="21" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Path from A to D: A → B → D</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Undirected graph: an edge connects two vertices in both directions.</text></svg>