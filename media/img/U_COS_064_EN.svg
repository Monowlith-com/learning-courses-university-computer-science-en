<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Three score intervals with boundary values 49, 50, 79 and 80"><title>Score classification boundaries</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38526b" stroke="none"/></marker></defs><rect width="900" height="440" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif" fill="#172c43" stroke="none"><text x="450" y="36" font-size="25" font-weight="bold" text-anchor="middle">Score classification boundaries</text><g stroke="#38526b" stroke-width="2" fill="none"><rect x="70" y="115" width="355" height="100" rx="8" fill="#dcefe7" stroke="#38526b" stroke-width="2"/><text x="247.5" y="158.5" text-anchor="middle" font-size="19">basic</text><text x="247.5" y="183.5" text-anchor="middle" font-size="19">0–49</text><rect x="425" y="115" width="215" height="100" rx="8" fill="#e4eaf3" stroke="#38526b" stroke-width="2"/><text x="532.5" y="158.5" text-anchor="middle" font-size="19">standard</text><text x="532.5" y="183.5" text-anchor="middle" font-size="19">50–79</text><rect x="640" y="115" width="160" height="100" rx="8" fill="#f9e7cc" stroke="#38526b" stroke-width="2"/><text x="720.0" y="158.5" text-anchor="middle" font-size="19">advanced</text><text x="720.0" y="183.5" text-anchor="middle" font-size="19">80–100</text><path d="M70 215V250"/><text x="70" y="280" text-anchor="middle" font-size="19">0</text><path d="M425 215V250"/><text x="425" y="280" text-anchor="middle" font-size="19">49 | 50</text><path d="M640 215V250"/><text x="640" y="280" text-anchor="middle" font-size="19">79 | 80</text><path d="M800 215V250"/><text x="800" y="280" text-anchor="middle" font-size="19">100</text><text x="450" y="333" text-anchor="middle" font-size="19">Invalid: −1, 101, wrong input type</text><text x="450" y="365" text-anchor="middle" font-size="16">Interval widths schematic</text></g></g><style>text{fill:#172c43;stroke:none}</style></svg>