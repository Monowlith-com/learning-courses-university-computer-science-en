<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Scientific evaluation: five steps</title><desc>A process of observation, precise hypothesis, controlled comparison, measurements and critical interpretation. A database index is the example. One measurement alone does not establish a general speed improvement.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Scientific evaluation: five steps</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Example: response times of a database query</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><rect x="37" y="256" width="142" height="100" fill="#dcecff" stroke="#286fba" rx="12" stroke-width="2" /><text x="108.0" y="297" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Observation</text><text x="108.0" y="326" fill="#61758a" font-size="12" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">seems faster</text><line x1="182.00" y1="306.00" x2="203.00" y2="306.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><polygon points="203.00,306.00 195.90,309.69 195.90,302.31" fill="#253d59" stroke="#253d59" stroke-width="0" /><rect x="208" y="256" width="142" height="100" fill="#ffe7cf" stroke="#bc6924" rx="12" stroke-width="2" /><text x="279.0" y="297" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Hypothesis</text><text x="279.0" y="326" fill="#61758a" font-size="12" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">shorter time</text><line x1="353.00" y1="306.00" x2="374.00" y2="306.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><polygon points="374.00,306.00 366.90,309.69 366.90,302.31" fill="#253d59" stroke="#253d59" stroke-width="0" /><rect x="379" y="256" width="142" height="100" fill="#dcecff" stroke="#286fba" rx="12" stroke-width="2" /><text x="450.0" y="297" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Comparison</text><text x="450.0" y="326" fill="#61758a" font-size="12" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">same conditions</text><line x1="524.00" y1="306.00" x2="545.00" y2="306.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><polygon points="545.00,306.00 537.90,309.69 537.90,302.31" fill="#253d59" stroke="#253d59" stroke-width="0" /><rect x="550" y="256" width="142" height="100" fill="#ffe7cf" stroke="#bc6924" rx="12" stroke-width="2" /><text x="621.0" y="297" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Measurements</text><text x="621.0" y="326" fill="#61758a" font-size="12" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">measure repeatedly</text><line x1="695.00" y1="306.00" x2="716.00" y2="306.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><polygon points="716.00,306.00 708.90,309.69 708.90,302.31" fill="#253d59" stroke="#253d59" stroke-width="0" /><rect x="721" y="256" width="142" height="100" fill="#dcecff" stroke="#286fba" rx="12" stroke-width="2" /><text x="792.0" y="297" fill="#253d59" font-size="15" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Interpretation</text><text x="792.0" y="326" fill="#61758a" font-size="12" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">report limitations</text><text x="450" y="437" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Example: a database query with and without an index</text><text x="450" y="477" fill="#61758a" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Compare the data, hardware, load and measurement method.</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">An observed difference is not yet a universally valid causal claim.</text></svg>