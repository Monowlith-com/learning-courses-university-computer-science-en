<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Prompting guides the model through instructions in its context. RAG retrieves external documents for a query. Fine-tuning changes model parameters using training data; these methods can be combined.">
<title>Prompting, RAG and fine-tuning</title>
<desc>Prompting guides the model through instructions in its context. RAG retrieves external documents for a query. Fine-tuning changes model parameters using training data; these methods can be combined.</desc>
