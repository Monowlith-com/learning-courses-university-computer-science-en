<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The database server checks SQL and permissions, determines an access plan, performs a table scan or index lookup and returns ordered result rows.">
<title>SQL: from command to result</title>
<desc>The database server checks SQL and permissions, determines an access plan, performs a table scan or index lookup and returns ordered result rows.</desc>
