<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The training set updates model parameters. Validation is used for model selection. The untouched test set provides a final assessment. Two schematic error curves show overfitting.">
