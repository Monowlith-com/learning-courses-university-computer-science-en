<text x="262.5" y="368.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Host operating system / kernel</text>
<rect x="80" y="398" width="365" height="58" rx="2" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="262.5" y="435.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Host hardware</text>
<rect x="527" y="197" width="365" height="58" rx="2" fill="#EAF4FF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="709.5" y="234.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Application + libraries</text>
<rect x="527" y="264" width="365" height="58" rx="2" fill="#EAF4FF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="709.5" y="301.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest operating system</text>
<rect x="527" y="331" width="365" height="58" rx="2" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="709.5" y="368.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Hypervisor (simplified)</text>
<rect x="527" y="398" width="365" height="58" rx="2" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="709.5" y="435.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Host hardware</text>
<text x="46" y="560" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Containers share the host kernel; VMs run their own guest OS.</text>
