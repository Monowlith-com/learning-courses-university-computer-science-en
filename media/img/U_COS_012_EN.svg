<text x="707" y="164" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Virtual machine</text>
<rect x="80" y="197" width="365" height="58" rx="2" fill="#EAF4FF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="262.5" y="234.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Application + libraries</text>
<rect x="80" y="264" width="365" height="58" rx="2" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="262.5" y="301.0" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Container runtime</text>
