<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><rect width="1000" height="480" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><text x="500" y="42" font-family="DejaVu Sans,sans-serif" font-size="30" text-anchor="middle" fill="#172334">Type checking and constant folding</text><rect x="42" y="85" width="276" height="130" rx="10" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="180.0" y="125.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">(x + 2 × 3) &lt; 10</text><text x="180.0" y="157.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">x: int</text><text x="180.0" y="189.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">⇒ bool</text><rect x="362" y="85" width="276" height="130" rx="10" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="500.0" y="125.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">(x + 6) &lt; 10</text><text x="500.0" y="157.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">x: int</text><text x="500.0" y="189.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">⇒ bool</text><rect x="682" y="85" width="276" height="130" rx="10" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="820.0" y="125.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">t0 = load x</text><text x="820.0" y="157.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">t1 = const 6</text><text x="820.0" y="189.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">t2 = add t0,t1</text><path d="M318 150L360 150" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M638 150L680 150" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="682" y="250" width="276" height="90" rx="10" fill="#e8f1fa" stroke="#334155" stroke-width="2"/><text x="820.0" y="286.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">t3 = const 10</text><text x="820.0" y="318.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#172334">t4 = lt t2,t3</text><path d="M820 215L820 248" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="180" y="250" font-family="DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#172334">AST · type checking</text><text x="500" y="250" font-family="DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#172334">2 × 3 = 6</text><text x="500" y="410" font-family="DejaVu Sans,sans-serif" font-size="23" text-anchor="middle" fill="#172334">7 → 5 instructions; same value and type</text></svg>